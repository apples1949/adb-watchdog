name: Build & Release APK

on:
  # 有新提交（push 到 main）就自动构建并重发 Release
  push:
    branches: [ main ]
  # 也允许在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: write

# 同一时间只跑一个构建，新提交会取消还在跑的旧构建
concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME 已设、许可已接受），
      # AGP 8.5.2 + compileSdk 34 可直接构建

      # 还原固定 debug 签名（secret: DEBUG_KEYSTORE_BASE64）。
      # 签名固定后，新构建可以直接覆盖安装，且 WRITE_SECURE_SETTINGS 授权不丢。
      - name: Restore fixed debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::Secret DEBUG_KEYSTORE_BASE64 未设置，本次使用随机 debug 签名（无法覆盖安装）"
          else
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Fixed debug keystore restored ($(wc -c < ~/.android/debug.keystore) bytes)"
          fi

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      # 编译/构建失败时，把完整日志原样打印到这一步的输出里
      - name: Print full build log on failure
        if: failure()
        run: cat build.log

      # 无论成败都留一份完整日志 artifact，随时可下载排查
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Prepare APK
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/adb-watchdog-latest.apk

      # 删除旧的 latest 发行版（连同 tag），失败（首次不存在）则忽略
      - name: Delete previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

      # 以当前提交重新打 latest tag 并发行，资产直接挂 APK（不是 zip）
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT="${GITHUB_SHA::7}"
          VERSION="${VERSION:-unknown}"
          NOTES=$(cat <<EOF
          自动构建：v$VERSION（commit $SHORT，$(date -u +'%Y-%m-%d %H:%M UTC')）
          签名：固定 debug 签名

          - 手机上已是 v0.2.4 或更高：直接下载覆盖安装，应用数据与授权原样保留
          - 手机上还是 v0.2.3 或更早（旧的随机签名版）：请先卸载旧版再安装，
            安装后执行一次授权：
            adb shell pm grant com.luffy.adbwatchdog android.permission.WRITE_SECURE_SETTINGS
          EOF
          )
          gh release create latest dist/adb-watchdog-latest.apk \
            --title "ADB Watchdog v$VERSION ($SHORT)" \
            --notes "$NOTES"

      # artifact 仅作排查留档，正式下载走 Release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: adb-watchdog-debug-apk
          path: dist/adb-watchdog-latest.apk
          if-no-files-found: error
