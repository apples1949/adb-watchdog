name: Build & Release APK

on:
  # 有新提交（push 到 main）就自动构建并重发 Release
  push:
    branches: [ main ]
  # 也允许在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: write

# 同一时间只跑一个构建，新提交会取消还在跑的旧构建
concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME 已设、许可已接受），
      # AGP 8.5.2 + compileSdk 34 可直接构建

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/adb-watchdog-latest.apk

      # 删除旧的 latest 发行版（连同 tag），失败（首次不存在）则忽略
      - name: Delete previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

      # 以当前提交重新打 latest tag 并发行，资产直接挂 APK（不是 zip）
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT="${GITHUB_SHA::7}"
          NOTES=$(cat <<EOF
          自动构建于 commit $SHORT（$(date -u +'%Y-%m-%d %H:%M UTC')）

          - 直接下载安装 adb-watchdog-latest.apk（debug 签名）
          - 若与手机上已装版本签名不同，请先卸载旧版再安装
          - 安装后执行一次授权：
            adb shell pm grant com.luffy.adbwatchdog android.permission.WRITE_SECURE_SETTINGS
          EOF
          )
          gh release create latest dist/adb-watchdog-latest.apk \
            --title "ADB Watchdog 最新构建 ($SHORT)" \
            --notes "$NOTES"

      # artifact 仅作排查留档，正式下载走 Release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: adb-watchdog-debug-apk
          path: dist/adb-watchdog-latest.apk
          if-no-files-found: error
