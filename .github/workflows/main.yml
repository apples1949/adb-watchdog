name: Build APK

on:
  # 手动触发：Actions 页面点 Run workflow
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：同时发布 Release 的标签名（如 v0.1.0），留空则只产出 Artifacts'
        required: false
        default: ''
  # 推送 v* 标签时自动构建并发 Release
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME 已设、许可已接受），
      # AGP 8.5.2 + compileSdk 34 可直接构建，无需额外安装 SDK

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: adb-watchdog-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 打了 v* 标签（或手动触发时填了 release_tag）才会执行，
      # APK 会作为 Release 资产发布，拿到永久下载链接
      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          name: ADB Watchdog ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          files: app/build/outputs/apk/debug/*.apk
